<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ホーム - Forme</title>
    
    <!-- PWA設定 (login.htmlと共通) -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Forme">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- 共通のCSSを適用 -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 背景の波 (透明度 0.30) -->
    <div class="bg-waves">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:rgba(0, 103, 192, 0.30);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:rgba(0, 103, 192, 0);stop-opacity:1" />
                </linearGradient>
            </defs>
            <path fill="url(#grad1)" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,218.7C960,235,1056,213,1152,186.7C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>

    <div class="wrapper">
        <main class="container">
            <!-- ホーム画面のメインカード -->
            <div class="card">
                <header class="card-header">
                    <div class="card-logo">
                        <span class="logo-dot"></span>Forme
                    </div>
                    <h1>こんにちは！</h1>
                    <p>今日のあなたの体験をデザインしましょう</p>
                </header>

                <div class="separator">本日のステータス</div>

                <!-- ダッシュボード風のコンテンツ -->
                <div style="display: flex; flex-direction: column; gap: 16px; margin: 20px 0;">
                    <div style="background: #f1f5f9; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <p style="font-size: 12px; color: var(--text-sub); margin: 0;">アクティブプロジェクト</p>
                            <p style="font-size: 20px; font-weight: 600; margin: 4px 0 0;">12件</p>
                        </div>
                        <span style="font-size: 24px;">🚀</span>
                    </div>

                    <div style="background: #f1f5f9; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <p style="font-size: 12px; color: var(--text-sub); margin: 0;">今週の進捗</p>
                            <p style="font-size: 20px; font-weight: 600; margin: 4px 0 0;">85%</p>
                        </div>
                        <span style="font-size: 24px;">📈</span>
                    </div>
                </div>

                <button type="button" class="submit-btn">新しいプロジェクトを作成</button>
                
                <p style="text-align: center; font-size: 13px; color: var(--text-sub); margin-top: 24px;">
                    設定を変更しますか？ <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">ログアウト</a>
                </p>
            </div>
        </main>
    </div>

    <!-- アプリ風ボトムタブバー (ホームをActiveに設定) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">ホーム</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🔍</span>
            <span class="nav-label">検索</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🔔</span>
            <span class="nav-label">通知</span>
        </a>
        <a href="login.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-label">ログイン</span>
        </a>
    </nav>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <div class="logo"><span class="logo-dot"></span>Forme</div>
                <p class="footer-description">洗練されたデザインと最高のユーザー体験をあなたに。</p>
            </div>
            <div class="footer-group">
                <div class="footer-column">
                    <h4>プロダクト</h4>
                    <a href="#">機能紹介</a>
                    <a href="#">料金プラン</a>
                </div>
                <div class="footer-column">
                    <h4>サポート</h4>
                    <a href="#">利用規約</a>
                    <a href="#">プライバシー</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Forme. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // PWA サービスワーカー登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Ready'))
                    .catch(err => console.log('PWA Error:', err));
            });
        }
    </script>
</body>
</html>
