<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <main class="login-container">
            <div class="login-box">
                <h2>アカウント作成</h2>
                
                <button type="button" id="google-login" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.svg" alt="Google icon">
                    Googleでログイン
                </button>

                <div class="divider"><span>または</span></div>

                <form id="registration-form">
                    <div class="input-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">パスワード</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" 
                                   pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{8,}$"
                                   title="英語大文字、数字、記号を各1文字以上含み、8文字以上で入力してください。ひらがな・カタカナは使用できません。"
                                   required>
                            <button type="button" id="togglePassword" class="toggle-btn">表示</button>
                        </div>
                        <ul class="requirements">
                            <li id="req-length">・8文字以上</li>
                            <li id="req-upper">・英語大文字を含む</li>
                            <li id="req-number">・数字を含む</li>
                            <li id="req-symbol">・記号(!@#$%^&*)を含む</li>
                            <li id="req-no-jp">・ひらがな/カタカナ不可</li>
                        </ul>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">パスワード（再確認）</label>
                        <input type="password" id="confirm-password" required>
                        <p id="match-error" class="error-msg">パスワードが一致しません</p>
                    </div>

                    <button type="submit" class="login-btn">登録する</button>
                </form>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Forme Business Group. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
