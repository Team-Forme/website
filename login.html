<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サインアップ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <main class="login-container">
            <div class="login-box">
                <h2>サインアップ</h2>
                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">パスワード</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required>
                            <button type="button" id="togglePassword" class="toggle-btn">表示</button>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">登録</button>
                </form>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Forme Business Group. All rights reserved.</p>
    </footer>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');

        toggleBtn.addEventListener('click', function() {
            // すでに表示されている状態（2秒間の間）はボタンを押しても何もしない
            if (passwordInput.type === 'text') return;

            // 1. パスワードを「テキスト」にして見えるようにする
            passwordInput.type = 'text';
            toggleBtn.textContent = '表示中';

            // 2. 2秒後（2000ミリ秒後）に元の「パスワード（伏字）」に戻す
            setTimeout(() => {
                passwordInput.type = 'password';
                toggleBtn.textContent = '表示';
            }, 2000);
        });
    </script>
</body>
</html>
