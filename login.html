<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サインアップ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <main class="container">
            <div class="card">
                <header class="card-header">
                    <h1>サインアップ</h1>
                    <p>サービスを利用するためにアカウントを作成してください</p>
                </header>
                
                    <!-- Googleログインボタン -->
                <button type="button" id="google-login" class="google-btn">
                    <!-- 修正：googleマークを正しく表示 -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        <path fill="none" d="M0 0h48v48H0z"/>
                    </svg>   
                    <span>Googleで登録</span>
                </button>

                <div class="separator">or</div>

                <form id="registration-form">
                    <div class="field">
                        <label>メールアドレス</label>
                        <input type="email" placeholder="example@mail.com" required>
                    </div>
                    
                    <div class="field">
                        <label>パスワード</label>
                        <div class="password-group">
                            <input type="password" id="password" placeholder="••••••••" required>
                            <button type="button" id="togglePassword" class="eye-icon">Show</button>
                        </div>
                        <div class="strength-meter">
                            <div class="meter-bar" id="meter-bar"></div>
                        </div>
                        <ul class="hints">
                            <li id="req-length">8文字以上</li>
                            <li id="req-upper">大文字</li>
                            <li id="req-number">数字</li>
                            <li id="req-symbol">記号</li>
                        </ul>
                    </div>

                    <div class="field">
                        <label>パスワードを再入力</label>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                        <span id="match-error" class="error-text">パスワードが一致しません</span>
                    </div>

                    <button type="submit" class="submit-btn">アカウントを作成</button>
                </form>
            </div>
        </main>
    </div>
    <div class="bg-waves">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
            <!-- 薄い青色のグラデーションを定義 -->
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:rgba(0, 103, 192, 0.30);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:rgba(0, 103, 192, 0);stop-opacity:1" />
                </linearGradient>
            </defs>
            <!-- 波の形を描画 -->
            <path fill="url(#grad1)" fill-opacity="1" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,218.7C960,235,1056,213,1152,186.7C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>
    <footer class="main-footer">
        <p>&copy; 2026 Forme. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
