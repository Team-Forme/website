<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サインアップ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <main class="container">
            <div class="card">
                <header class="card-header">
                    <h1>Create Account</h1>
                    <p>サイトを開始するために詳細を入力してください</p>
                </header>
                
                <button type="button" id="google-login" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.svg" alt="">
                    <span>Continue with Google</span>
                </button>

                <div class="separator">or</div>

                <form id="registration-form">
                    <div class="field">
                        <label>Email Address</label>
                        <input type="email" placeholder="email@example.com" required>
                    </div>
                    
                    <div class="field">
                        <label>Password</label>
                        <div class="password-group">
                            <input type="password" id="password" placeholder="••••••••" required>
                            <button type="button" id="togglePassword" class="eye-icon">Show</button>
                        </div>
                        <div class="strength-meter">
                            <div class="meter-bar" id="meter-bar"></div>
                        </div>
                        <ul class="hints">
                            <li id="req-length">8文字以上</li>
                            <li id="req-upper">大文字</li>
                            <li id="req-number">数字</li>
                            <li id="req-symbol">記号</li>
                        </ul>
                    </div>

                    <div class="field">
                        <label>Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                        <span id="match-error" class="error-text">パスワードが一致しません</span>
                    </div>

                    <button type="submit" class="submit-btn">Create Account</button>
                </form>
            </div>
        </main>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Forme Business Group. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
